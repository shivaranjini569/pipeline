apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: menu-calculator
  template:
    metadata:
      labels:
        app: menu-calculator
    spec:
      containers:
        - name: calculator
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5